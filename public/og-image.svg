<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627d98;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#486581;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="60" fill="white" opacity="0.08"/>
  <circle cx="1120" cy="550" r="100" fill="white" opacity="0.08"/>
  
  <!-- Main Content Container -->
  <g transform="translate(600, 315)">
    <!-- Logo Badge -->
    <rect x="-70" y="-180" width="140" height="140" rx="28" fill="white" opacity="0.15" filter="url(#shadow)"/>
    <text x="0" y="-110" font-family="'Arial', 'Helvetica', sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)" letter-spacing="2">MIE</text>
    
    <!-- Name -->
    <text x="0" y="-30" font-family="'Arial', 'Helvetica', sans-serif" font-size="58" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)" letter-spacing="1">Menyaga Enyo Israel</text>
    
    <!-- Title -->
    <text x="0" y="30" font-family="'Arial', 'Helvetica', sans-serif" font-size="34" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-weight="500">Full Stack Developer</text>
    
    <!-- Tech Stack -->
    <text x="0" y="85" font-family="'Arial', 'Helvetica', sans-serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="0.5">React • Next.js • TypeScript • Tailwind CSS</text>
    
    <!-- Tagline -->
    <text x="0" y="130" font-family="'Arial', 'Helvetica', sans-serif" font-size="18" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="300">Building production-ready websites from Figma to deployment</text>
    
    <!-- URL -->
    <text x="0" y="180" font-family="'Arial', 'Helvetica', sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="300">mieworks.vercel.app</text>
  </g>
</svg>

