<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="twitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627d98;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#486581;stop-opacity:1" />
    </linearGradient>
    <filter id="twitterShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#twitterGrad)"/>
  
  <!-- Subtle pattern -->
  <g opacity="0.08">
    <circle cx="100" cy="100" r="80" fill="white"/>
    <circle cx="1100" cy="500" r="120" fill="white"/>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(600, 300)">
    <!-- Logo Badge -->
    <rect x="-60" y="-160" width="120" height="120" rx="24" fill="white" opacity="0.15" filter="url(#twitterShadow)"/>
    <text x="0" y="-95" font-family="'Arial', 'Helvetica', sans-serif" font-size="68" font-weight="bold" fill="white" text-anchor="middle" filter="url(#twitterShadow)" letter-spacing="2">MIE</text>
    
    <!-- Name -->
    <text x="0" y="10" font-family="'Arial', 'Helvetica', sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" filter="url(#twitterShadow)" letter-spacing="1">Menyaga Enyo Israel</text>
    
    <!-- Title -->
    <text x="0" y="70" font-family="'Arial', 'Helvetica', sans-serif" font-size="30" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-weight="500">Full Stack Developer</text>
    
    <!-- Tech -->
    <text x="0" y="120" font-family="'Arial', 'Helvetica', sans-serif" font-size="20" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="0.5">React • Next.js • TypeScript • Web3 Enthusiast</text>
    
    <!-- URL -->
    <text x="0" y="170" font-family="'Arial', 'Helvetica', sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-weight="300">@M_I_E_CODE</text>
  </g>
</svg>

